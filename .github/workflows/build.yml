name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension (.vsix)
        run: npx --yes @vscode/vsce package --no-dependencies --out oculix-vscode.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: oculix-vscode-vsix
          path: oculix-vscode.vsix
          if-no-files-found: error
          retention-days: 14
